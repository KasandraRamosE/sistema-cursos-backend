# ============================================================
# application-prod.yml
# Ubicación: backend/sistema-cursos/src/main/resources/
# Se activa con: -Dspring.profiles.active=prod
# Todos los valores sensibles vienen de variables de entorno
# ============================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Pool de conexiones — ajustar según carga esperada
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  jwt:
    secret: ${JWT_SECRET}
  mocks:
    umsa-auth: true
    libelula-pay: true
  email:
    base-url: ${APP_BASE_URL}
  # Ruta relativa al directorio de trabajo del contenedor (/app)
  # Los volúmenes de Docker montan las carpetas reales ahí
  certificados:
    directorio: /app/certificados
  archivos:
    directorio: /app/uploads
  # La ruta del logo ahora es relativa — no más rutas de Windows
  reportes:
    logo: /app/uploads/logo.jpg

logging:
  level:
    bo.edu.umsa.fhce: INFO
    org.springframework.security: WARN
  file:
    name: /app/logs/sistema-cursos.log